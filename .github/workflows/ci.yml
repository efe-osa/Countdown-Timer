name: CI
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build -- --configuration production

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4 #Recommended if you intend to make multiple deployments in quick succession.
        if: github.ref == 'refs/heads/gh-pages'
        with:
          folder: dist/countdown-timer
          token: ${{ secrets.GH_TOKEN }}
          branch: gh-pages
          commit_message: 'Deploy to GitHub Pages'
          commit_author: 'GitHub Actions <actions@github.com>'
          commit_email: 'actions@github.com'
          commit_author_email: 'actions@github.com'
          commit_author_name: 'GitHub Actions'
